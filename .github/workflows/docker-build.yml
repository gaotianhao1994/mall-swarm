# ============================================================
#  mall-swarm CI/CD 工作流 — 自动构建 Docker 镜像并推送到 ACR
#
#  镜像仓库策略：单仓库 + Tag 区分
#    所有服务镜像推送到同一个 ACR 仓库(mall-swarm-202606)
#    用 tag 区分服务，如 :mall-gateway, :mall-admin:latest 等
#
#  完整镜像路径示例：
#    crpi-xxx.cn-guangzhou.personal.cr.aliyuncs.com/mall-swarm-202606/mall-swarm-202606:mall-gateway
# ============================================================

name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: ${{ secrets.ACR_REGISTRY }}
  NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  # ACR 仓库名（所有服务共用这一个仓库）
  REPO: mall-swarm-202606

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ---- Step 1: 检出代码 ----
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Step 2: JDK 17 ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ---- Step 3: Maven 编译打包 ----
      - name: Build with Maven
        env:
          MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"
        run: |
          mvn clean package \
            -DskipTests \
            -Ddocker.skip=true \
            --batch-mode \
            --no-transfer-progress \
            -pl "!mall-demo" \
            -am \
            2>&1 | tee maven-build.log

          echo "===== Maven 构建摘要 ====="
          tail -30 maven-build.log

          echo ""
          echo "===== 验证 JAR 文件 ====="
          find . -path "*/target/*.jar" -not -name "*sources.jar" -not -name "*javadoc.jar" | sort

      # ---- Step 4: Docker Buildx + 镜像加速 ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "registry-mirrors": [
              "https://docker.1ms.run",
              "https://docker.xuanyuan.me"
            ]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # ---- Step 5: 登录 ACR ----
      - name: Verify ACR configuration
        run: |
          echo "===== ACR 配置验证 ====="
          echo "Registry:   ${{ env.REGISTRY }}"
          echo "Namespace:  ${{ env.NAMESPACE }}"
          echo "Repository: ${{ env.REPO }}"
          echo "Image tag:  ${{ env.IMAGE_TAG }}"
          echo ""
          echo "镜像路径格式: \${REGISTRY}/\${NAMESPACE}/\${REPO}:\${SERVICE}:\${TAG}"
          echo "示例: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-gateway"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ---- Step 6~11: 构建各微服务镜像并推送 ----
      #    单仓库模式：所有镜像推送到 ${REGISTRY}/${NAMESPACE}/${REPO}
      #    用 tag 区分服务名和版本

      - name: Build & Push mall-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-gateway-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-gateway-latest
          build-args: |
            JAR_PATH=mall-gateway/target/mall-gateway-1.0-SNAPSHOT.jar

      - name: Build & Push mall-admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-admin-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-admin-latest
          build-args: |
            JAR_PATH=mall-admin/target/mall-admin-1.0-SNAPSHOT.jar

      - name: Build & Push mall-auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-auth-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-auth-latest
          build-args: |
            JAR_PATH=mall-auth/target/mall-auth-1.0-SNAPSHOT.jar

      - name: Build & Push mall-portal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-portal-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-portal-latest
          build-args: |
            JAR_PATH=mall-portal/target/mall-portal-1.0-SNAPSHOT.jar

      - name: Build & Push mall-search
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-search-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-search-latest
          build-args: |
            JAR_PATH=mall-search/target/mall-search-1.0-SNAPSHOT.jar

      - name: Build & Push mall-monitor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-monitor-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-monitor-latest
          build-args: |
            JAR_PATH=mall-monitor/target/mall-monitor-1.0-SNAPSHOT.jar

      # ---- 汇总 ----
      - name: Summary
        run: |
          R="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}"
          T="${{ env.IMAGE_TAG }}"
          echo "## 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 服务 | 镜像标签 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| mall-gateway | \`${R}:mall-gateway-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-admin | \`${R}:mall-admin-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-auth | \`${R}:mall-auth-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-portal | \`${R}:mall-portal-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-search | \`${R}:mall-search-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-monitor | \`${R}:mall-monitor-${T}\` |" >> $GITHUB_STEP_SUMMARY
