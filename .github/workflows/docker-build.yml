# ============================================================
#  GitHub Actions 工作流说明
#
#  【什么是 GitHub Actions？】
#  GitHub Actions 是 GitHub 提供的自动化服务。
#  你在代码仓库的 .github/workflows/ 目录下放一个 yml 文件，
#  GitHub 就会在你 push 代码时，自动执行这个文件里定义的任务。
#
#  【目录结构要求】
#  文件必须放在 .github/workflows/ 目录下，GitHub 才能识别。
#  目录结构：
#    your-repo/
#    ├── .github/
#    │   └── workflows/
#    │       └── docker-build.yml    ← 就是这个文件
#    ├── src/
#    ├── pom.xml
#    └── ...
#
#  【触发条件】
#  当你执行 git push origin master 时，GitHub 检测到代码变化，
#  自动读取 .github/workflows/ 下的 yml 文件，按照里面定义的步骤执行。
#
#  【这个工作流做了什么？】
#  1. 拉取你的 Java 代码
#  2. 安装 JDK 17 + Maven
#  3. 编译打包成 6 个 JAR 文件
#  4. 把每个 JAR 打包成 Docker 镜像
#  5. 把 6 个镜像推送到阿里云 ACR 镜像仓库
#
#  【你需要配置什么？】
#  在 GitHub 仓库的 Settings → Secrets and variables → Actions 中，
#  添加以下 4 个 Secret（密码/凭证）：
#    ACR_USERNAME  = 你的阿里云账号 ID
#    ACR_PASSWORD  = 你设置的 ACR 固定密码
#    ACR_REGISTRY  = crpi-9lhedueyyvqzcyrk.cn-guangzhou.personal.cr.aliyuncs.com
#    ACR_NAMESPACE = mall-swarm-202606
# ============================================================

# 工作流名称（在 GitHub Actions 页面显示的名字）
name: Build and Push Docker Images

# ============================================================
# 【触发条件 on】
# 定义什么时候自动执行这个工作流
# ============================================================
on:
  # 当代码 push 到 main 或 master 分支时触发
  push:
    branches: [ main, master ]

  # 当打 tag（如 v1.0.0）时也触发
  tags: [ 'v*' ]

  # 还支持手动触发（在 GitHub Actions 页面点 "Run workflow" 按钮）
  workflow_dispatch:

# ============================================================
# 【全局环境变量 env】
# 这些变量在整个工作流中都能用到
# ${{ secrets.xxx }} 是从 GitHub Secrets 中读取的敏感信息
# ${{ github.sha }} 是当前 commit 的完整 hash 值（如 a1b2c3d4e5f6...）
# ============================================================
env:
  # 用 git commit hash 作为镜像标签，保证每次构建的镜像都是唯一的
  IMAGE_TAG: ${{ github.sha }}

  # 阿里云 ACR 镜像仓库地址（从 Secrets 读取）
  REGISTRY: ${{ secrets.ACR_REGISTRY }}

  # ACR 命名空间（从 Secrets 读取）
  NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

  # ACR 仓库名（所有服务共用这一个仓库，用 tag 区分不同服务）
  REPO: mall-swarm-202606

# ============================================================
# 【任务 jobs】
# 一个工作流可以包含多个 job，这里只有一个 job：构建并推送镜像
# ============================================================
jobs:
  build-and-push:
    name: 构建并推送镜像

    # 在 GitHub 提供的 Ubuntu 虚拟机上运行
    runs-on: ubuntu-latest

    # 超时时间：45 分钟（构建 Java 项目比较慢）
    timeout-minutes: 45

    # ============================================================
    # 【步骤 steps】
    # 每个 step 是一个独立的操作，按顺序执行
    # ============================================================
    steps:

      # ---- Step 1: 检出代码 ----
      # 作用：把你的代码从 GitHub 仓库下载到 GitHub 的虚拟机上
      # 等价于：git clone https://github.com/gaotianhao1994/mall-swarm.git
      # 为什么用 uses: 而不是写 git clone？
      #   GitHub Actions 把常用操作封装成了"Action"（可复用组件）
      #   actions/checkout@v4 就是官方提供的"检出代码"组件
      #   你只需要写 uses: 就能直接用，不用自己写 git 命令
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Step 2: 安装 JDK 17 ----
      # Java 项目需要 JDK 才能编译
      # temurin 是 Eclipse 提供的开源 JDK 发行版
      # cache: maven 会缓存 Maven 依赖，第二次构建会快很多
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ---- Step 3: Maven 编译打包 ----
      # 把 Java 源代码编译成 JAR 文件
      # mvn clean package = 清理旧文件 + 编译 + 打包
      # -DskipTests = 跳过测试（加快构建速度）
      # -Ddocker.skip=true = 跳过原项目的 Docker 构建
      #   原因：原项目 pom.xml 里配了 docker-maven-plugin，Maven 编译完会自动构建 Docker 镜像
      #   但我们不想用它自动构建的镜像（Dockerfile 不适合生产环境）
      #   所以跳过，后面我们用自己的 docker/Dockerfile.module 来构建
      # -pl "!mall-demo" = 排除 mall-demo 模块（不需要部署）
      # -am = 同时构建被依赖的模块（如 mall-common）
      - name: Build with Maven
        env:
          MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"
        run: |
          mvn clean package \
            -DskipTests \
            -Ddocker.skip=true \
            --batch-mode \
            --no-transfer-progress \
            -pl "!mall-demo" \
            -am \
            2>&1 | tee maven-build.log

          echo "===== Maven 构建摘要 ====="
          tail -30 maven-build.log

          echo ""
          echo "===== 验证 JAR 文件 ====="
          find . -path "*/target/*.jar" -not -name "*sources.jar" -not -name "*javadoc.jar" | sort

      # ---- Step 4: 设置 Docker Buildx ----
      # Buildx 是 Docker 的扩展构建工具，支持缓存、多平台构建等
      # 这里主要是为了后续的镜像加速配置
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 配置 Docker 镜像加速器（国内网络拉取 Docker 官方镜像很慢）
      # 这些是国内的 Docker 镜像代理，加速拉取 mysql:5.7、redis:7 等公共镜像
      - name: Configure Docker mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "registry-mirrors": [
              "https://docker.1ms.run",
              "https://docker.xuanyuan.me"
            ]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # ---- Step 5: 登录阿里云 ACR ----
      # 要推送镜像到 ACR，需要先登录（类似 git push 需要先登录 GitHub）
      # username 和 password 从 GitHub Secrets 读取
      - name: Verify ACR configuration
        run: |
          echo "===== ACR 配置验证 ====="
          echo "Registry:   ${{ env.REGISTRY }}"
          echo "Namespace:  ${{ env.NAMESPACE }}"
          echo "Repository: ${{ env.REPO }}"
          echo "Image tag:  ${{ env.IMAGE_TAG }}"
          echo ""
          echo "镜像路径格式: \${REGISTRY}/\${NAMESPACE}/\${REPO}:\${SERVICE}:\${TAG}"
          echo "示例: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-gateway"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ---- Step 6~11: 构建 6 个微服务的 Docker 镜像并推送到 ACR ----
      #
      # 【每个服务的构建流程】
      # 1. 读取 Dockerfile.module（通用 Dockerfile）
      # 2. 通过 build-args 传入 JAR 文件路径
      # 3. Dockerfile 把 JAR 打包成镜像
      # 4. 推送到 ACR，打两个 tag：
      #    - mall-gateway-<commit hash>  ← 精确版本，可回滚
      #    - mall-gateway-latest         ← 最新版本，docker-compose 用这个
      #
      # 【镜像路径格式】
      # crpi-xxx.cn-guangzhou.personal.cr.aliyuncs.com/mall-swarm-202606/mall-swarm-202606:mall-gateway-latest
      # └── ACR 地址 ─────────────────────┘└── 命名空间 ────────┘└── 仓库名 ──────┘└─ tag ─┘

      # 构建 mall-gateway 镜像
      - name: Build & Push mall-gateway
        uses: docker/build-push-action@v5
        with:
          context: .                          # 构建上下文：项目根目录
          file: ./docker/Dockerfile.module    # 使用的 Dockerfile
          push: true                          # 构建后推送到 ACR
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-gateway-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-gateway-latest
          build-args: |
            JAR_PATH=mall-gateway/target/mall-gateway-1.0-SNAPSHOT.jar

      # 构建 mall-admin 镜像
      - name: Build & Push mall-admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-admin-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-admin-latest
          build-args: |
            JAR_PATH=mall-admin/target/mall-admin-1.0-SNAPSHOT.jar

      # 构建 mall-auth 镜像
      - name: Build & Push mall-auth
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-auth-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-auth-latest
          build-args: |
            JAR_PATH=mall-auth/target/mall-auth-1.0-SNAPSHOT.jar

      # 构建 mall-portal 镜像
      - name: Build & Push mall-portal
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-portal-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-portal-latest
          build-args: |
            JAR_PATH=mall-portal/target/mall-portal-1.0-SNAPSHOT.jar

      # 构建 mall-search 镜像
      - name: Build & Push mall-search
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-search-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-search-latest
          build-args: |
            JAR_PATH=mall-search/target/mall-search-1.0-SNAPSHOT.jar

      # 构建 mall-monitor 镜像
      - name: Build & Push mall-monitor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-monitor-${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}:mall-monitor-latest
          build-args: |
            JAR_PATH=mall-monitor/target/mall-monitor-1.0-SNAPSHOT.jar

      # ---- Step 12: 构建结果汇总 ----
      # 在 GitHub Actions 页面显示一个表格，列出所有构建好的镜像
      - name: Summary
        run: |
          R="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.REPO }}"
          T="${{ env.IMAGE_TAG }}"
          echo "## 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 服务 | 镜像标签 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| mall-gateway | \`${R}:mall-gateway-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-admin | \`${R}:mall-admin-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-auth | \`${R}:mall-auth-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-portal | \`${R}:mall-portal-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-search | \`${R}:mall-search-${T}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-monitor | \`${R}:mall-monitor-${T}\` |" >> $GITHUB_STEP_SUMMARY
