# ============================================================
#  mall-swarm CI/CD 工作流 — 自动构建 Docker 镜像并推送到 ACR
#
#  流程：
#    checkout → Maven 构建(根目录) → Docker 构建(context=根目录) → 推送 ACR
# ============================================================

name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: ${{ secrets.ACR_REGISTRY }}
  NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ---- Step 1: 检出代码 ----
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Step 2: JDK 17 ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ---- Step 3: Maven 编译打包（在项目根目录执行）----
      - name: Build with Maven
        env:
          MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"
        run: |
          mvn clean package \
            -DskipTests \
            -Ddocker.skip=true \
            --batch-mode \
            --no-transfer-progress \
            -pl !mall-demo \
            -am \
            2>&1 | tee maven-build.log

          echo "===== Maven 构建摘要 ====="
          tail -30 maven-build.log

          echo ""
          echo "===== 验证 JAR 文件 ====="
          find . -path "*/target/*.jar" -not -name "*sources.jar" -not -name "*javadoc.jar" | sort

      # ---- Step 4: Docker Buildx + 镜像加速 ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Actions 运行器访问 Docker Hub 不稳定，配置国内镜像加速
      - name: Configure Docker mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{
            "registry-mirrors": [
              "https://docker.1ms.run",
              "https://docker.xuanyuan.me"
            ]
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # ---- Step 5: 登录 ACR ----
      - name: Verify ACR configuration
        run: |
          echo "===== ACR 配置验证 ====="
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Image tag: ${{ env.IMAGE_TAG }}"
          echo ""
          echo "预期镜像路径示例:"
          echo "  ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-gateway:${{ env.IMAGE_TAG }}"
          echo ""
          if [ -z "${{ env.REGISTRY }}" ] || [ "${{ env.REGISTRY }}" = "mall-swarm-202606.cn-hangzhou.cr.aliyuncs.com" ]; then
            echo "::error::ACR_REGISTRY 值不正确！请检查 GitHub Secrets 中 ACR_REGISTRY 是否为广州个人版地址"
            exit 1
          fi

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ---- Step 6~11: 构建各微服务镜像 ----
      #    关键：context = "." （项目根目录），这样 COPY 能找到各模块的 target/JAR

      - name: Build mall-gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-gateway:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-gateway:latest
          build-args: |
            JAR_PATH=mall-gateway/target/mall-gateway-1.0-SNAPSHOT.jar

      - name: Build mall-admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-admin:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-admin:latest
          build-args: |
            JAR_PATH=mall-admin/target/mall-admin-1.0-SNAPSHOT.jar

      - name: Build mall-auth image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-auth:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-auth:latest
          build-args: |
            JAR_PATH=mall-auth/target/mall-auth-1.0-SNAPSHOT.jar

      - name: Build mall-portal image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-portal:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-portal:latest
          build-args: |
            JAR_PATH=mall-portal/target/mall-portal-1.0-SNAPSHOT.jar

      - name: Build mall-search image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-search:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-search:latest
          build-args: |
            JAR_PATH=mall-search/target/mall-search-1.0-SNAPSHOT.jar

      - name: Build mall-monitor image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.module
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-monitor:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-monitor:latest
          build-args: |
            JAR_PATH=mall-monitor/target/mall-monitor-1.0-SNAPSHOT.jar

      # ---- 汇总 ----
      - name: Summary
        run: |
          echo "## 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 服务 | 镜像 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| mall-gateway | \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-gateway:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-admin | \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-admin:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-auth | \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-auth:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-portal | \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-portal:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-search | \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-search:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| mall-monitor | \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mall-monitor:${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
