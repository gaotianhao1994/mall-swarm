# ============================================================
#  通用 API 代理 Nginx 配置（备用/参考）
#
#  【这个文件的作用】
#  这是一个纯 API 反向代理配置，将所有请求转发给 Gateway。
#  它不提供静态文件服务，只做 API 转发和限流。
#
#  【当前状态】
#  此配置目前未被使用！实际部署中，前端各自有独立的 nginx.conf
#  （mall-admin-web/nginx.conf 和 mall-app-web/nginx.conf），
#  那些配置既服务静态文件又代理 API。
#
#  保留此文件的原因：
#  1. 如果以后需要一个纯 API 网关代理（不服务前端），可以使用
#  2. 作为其他 nginx 配置的参考模板
#
#  【请求链路】
#  客户端 → Nginx(:80) → Gateway(:8201) → 各微服务
#
#  【限流机制】
#  使用 Nginx 的 limit_req 模块做 API 限流：
#  - 每个 IP 每秒最多 10 个请求（rate=10r/s）
#  - 允许突发 20 个请求排队（burst=20）
#  - 超出的请求立即返回 503（nodelay）
#  - zone=api_limit 使用 10MB 内存存储 IP 限流状态
# ============================================================

# 自动检测 CPU 核心数，每个核心一个 worker 进程
worker_processes auto;

events {
    # 每个 worker 进程最多同时处理 1024 个连接
    worker_connections 1024;
}

http {
    # MIME 类型映射
    include       mime.types;
    default_type  application/octet-stream;

    # 高效文件传输
    sendfile        on;
    keepalive_timeout 65;

    # ============================================================
    #  API 限流配置
    #  $binary_remote_addr: 按客户端 IP 限流（二进制格式省内存）
    #  zone=api_limit: 限流区域名，10MB 内存可存储约 16 万个 IP
    #  rate=10r/s: 每个 IP 每秒最多 10 个请求
    # ============================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Gateway 上游服务器（使用容器名，Docker 网络自动解析）
    upstream gateway {
        server mall-gateway:8201;
    }

    server {
        listen       80;
        server_name  _;

        # ============================================================
        #  通用 API 代理（catch-all）
        #  所有请求都转发给 Gateway，由 Gateway 根据路径前缀路由到具体服务
        #
        #  限流参数说明：
        #  - zone=api_limit: 使用上面定义的限流区域
        #  - burst=20: 允许突发 20 个请求排队
        #  - nodelay: 排队的请求不延迟，直接处理（超过 burst 的才拒绝）
        # ============================================================
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # ============================================================
        #  Nacos 控制台代理（仅调试用）
        #  通过 http://106.53.106.41/nacos/ 可以访问 Nacos 管理界面
        #  生产环境建议关闭或限制访问
        # ============================================================
        location /nacos/ {
            proxy_pass http://106.53.106.41:8848/nacos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============================================================
        #  健康检查端点
        #  供负载均衡器或监控系统探测 Nginx 是否存活
        #  访问 http://106.53.106.41/health 返回 "OK"
        # ============================================================
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
