# ============================================================
#  mall-swarm 阶段1 — 基础微服务骨架
#  腾讯云主服务器：MySQL + Redis + Nacos + Gateway + Admin + Auth
#
#  使用方式：
#    1. 复制 .env.example 为 .env 并填写密码
#    2. docker compose -f docker-compose.base.yml up -d
# ============================================================

services:

  # ==================== 基础设施 ====================

  mysql:
    image: mysql:5.7
    container_name: mall-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mall_root}
      MYSQL_DATABASE: mall
      TZ: Asia/Shanghai
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=256M
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${DATA_DIR:-/opt/mall-swarm/data}/mysql/data:/var/lib/mysql
      - ${DATA_DIR:-/opt/mall-swarm/data}/mysql/conf:/etc/mysql/conf.d
      - ${DATA_DIR:-/opt/mall-swarm/data}/mysql/log:/var/log/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mall_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mall-network

  redis:
    image: redis:7
    container_name: mall-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-mall_redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${DATA_DIR:-/opt/mall-swarm/data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mall_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mall-network

  nacos:
    image: nacos/nacos-server:v2.1.0
    container_name: mall-nacos
    restart: always
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "${NACOS_PORT:-8848}:8848"
    volumes:
      - ${DATA_DIR:-/opt/mall-swarm/data}/nacos:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/liveness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mall-network

  # ==================== 应用服务 ====================

  mall-gateway:
    image: ${ACR_REGISTRY:-crpi-9lhedueyyvqzcyrk.cn-guangzhou.personal.cr.aliyuncs.com}/${ACR_NAMESPACE:-mall-swarm-202606}/mall-gateway:latest
    container_name: mall-gateway
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx384m -XX:+UseG1GC"
      NACOS_SERVER: nacos:8848
      NACOS_NAMESPACE: public
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    ports:
      - "${GATEWAY_PORT:-8201}:8201"
    volumes:
      - ${LOG_DIR:-/opt/mall-swarm/logs}/gateway:/var/logs
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mall-network

  mall-admin:
    image: ${ACR_REGISTRY:-crpi-9lhedueyyvqzcyrk.cn-guangzhou.personal.cr.aliyuncs.com}/${ACR_NAMESPACE:-mall-swarm-202606}/mall-admin:latest
    container_name: mall-admin
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx384m -XX:+UseG1GC"
      NACOS_SERVER: nacos:8848
      NACOS_NAMESPACE: public
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB_NAME: mall
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mall_root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mall_redis}
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    volumes:
      - ${LOG_DIR:-/opt/mall-swarm/logs}/admin:/var/logs
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mall-network

  mall-auth:
    image: ${ACR_REGISTRY:-crpi-9lhedueyyvqzcyrk.cn-guangzhou.personal.cr.aliyuncs.com}/${ACR_NAMESPACE:-mall-swarm-202606}/mall-auth:latest
    container_name: mall-auth
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms192m -Xmx320m -XX:+UseG1GC"
      NACOS_SERVER: nacos:8848
      NACOS_NAMESPACE: public
    ports:
      - "${AUTH_PORT:-8401}:8401"
    volumes:
      - ${LOG_DIR:-/opt/mall-swarm/logs}/auth:/var/logs
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - mall-network

networks:
  mall-network:
    driver: bridge
